<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fundamentos antropológicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..800,0..100;1,9..144,300..600,0..100&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEE4CE;
  --paper: #F6EFDD;
  --ink: #2B1F17;
  --ink-soft: #6B5D4E;
  --rule: #C9BFA8;
  --rule-soft: #DBD1B9;

  /* Un color por dimensión (siguiendo el paletario del ecosistema PLAPA/CICAD) */
  --persona:   #8B2E1F;
  --alma:      #2E4E6F;
  --cuerpo:    #C08A2C;
  --individuo: #7B2E3F;
  --sociedad:  #3E6647;

  --active-color: var(--rule);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Fraunces', Georgia, serif;
  font-variation-settings: "opsz" 14, "SOFT" 50, "wght" 400;
  line-height: 1.55;
  min-height: 100vh;
  padding: clamp(1.25rem, 4vw, 3rem) clamp(1rem, 4vw, 2rem) 3rem;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.wrapper {
  max-width: 1080px;
  margin: 0 auto;
}

/* ---------- Logos ---------- */
.logos {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(1.5rem, 4vw, 3rem);
  flex-wrap: wrap;
  max-width: 900px;
  margin: 0 auto clamp(1.5rem, 3vw, 2.5rem);
  padding: 0 1rem clamp(1.25rem, 2.5vw, 1.75rem);
  border-bottom: 1px solid var(--rule);
}

.logos img {
  height: clamp(38px, 5vw, 52px);
  width: auto;
  max-width: 180px;
  object-fit: contain;
  opacity: 0.85;
  transition: opacity 0.25s ease;
  display: block;
}

.logos a { display: inline-block; line-height: 0; }
.logos img:hover { opacity: 1; }

/* ---------- Language toggle ---------- */
.lang-toggle {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 100;
  display: inline-flex;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 3px;
  box-shadow: 0 2px 10px rgba(43, 31, 23, 0.08);
}

.lang-toggle button {
  background: transparent;
  border: none;
  color: var(--ink-soft);
  font-family: 'Fraunces', Georgia, serif;
  font-variation-settings: "opsz" 14, "wght" 500;
  font-size: 0.78rem;
  padding: 0.35rem 0.85rem;
  border-radius: 999px;
  cursor: pointer;
  transition: color 0.2s ease, background 0.2s ease;
  letter-spacing: 0.08em;
  line-height: 1;
}

.lang-toggle button:hover { color: var(--ink); }
.lang-toggle button.active {
  background: var(--ink);
  color: var(--paper);
}
.lang-toggle button:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* ---------- Header ---------- */
header {
  text-align: center;
  margin-bottom: clamp(2rem, 4.5vw, 3.5rem);
  padding-top: clamp(0.5rem, 3vw, 2rem);
}

.eyebrow {
  font-variation-settings: "opsz" 14, "wght" 500;
  font-size: 0.78rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 1.1rem;
  opacity: 0.85;
}

h1 {
  font-variation-settings: "opsz" 144, "SOFT" 30, "wght" 500;
  font-size: clamp(2rem, 5.2vw, 3.6rem);
  line-height: 1.02;
  letter-spacing: -0.022em;
  color: var(--ink);
  max-width: 20ch;
  margin: 0 auto 1.5rem;
}

h1 em {
  font-style: italic;
  font-variation-settings: "opsz" 144, "SOFT" 60, "wght" 400;
  color: var(--persona);
}

.subtitle {
  font-variation-settings: "opsz" 24, "SOFT" 80, "wght" 400;
  font-style: italic;
  font-size: clamp(1rem, 1.55vw, 1.15rem);
  color: var(--ink-soft);
  max-width: 60ch;
  margin: 0 auto;
  line-height: 1.6;
}

/* ---------- Compass ---------- */
.compass-stage {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: clamp(0.5rem, 2vw, 1.5rem) 0;
  margin-bottom: 1.5rem;
}

.compass {
  width: min(540px, 90vw);
  height: min(540px, 90vw);
  filter: drop-shadow(0 10px 24px rgba(43, 31, 23, 0.12));
  overflow: visible;
}

.ring-outer { fill: none; stroke: var(--rule); stroke-width: 1; }
.ring-inner { fill: none; stroke: var(--rule-soft); stroke-width: 1; stroke-dasharray: 2 4; }
.cross-line { stroke: var(--rule); stroke-width: 1; }
.cardinal-tick { stroke: var(--ink); stroke-width: 1.5; }
.diagonal-line { stroke: var(--rule-soft); stroke-width: 1; }

.rhomb-major { fill: var(--paper); stroke: var(--rule); stroke-width: 1; }
.rhomb-minor { fill: var(--ink); opacity: 0.85; }

.node {
  cursor: pointer;
  transition: transform 200ms ease, opacity 200ms ease;
}

.node .node-bg {
  fill: var(--paper);
  stroke: var(--ink);
  stroke-width: 1.2;
  transition: fill 250ms ease, stroke 250ms ease;
}

.node .node-label {
  font-family: 'Fraunces', Georgia, serif;
  font-variation-settings: "opsz" 24, "wght" 500;
  font-style: italic;
  font-size: 16px;
  fill: var(--ink);
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
  transition: fill 250ms ease;
}

.node.center .node-bg {
  fill: var(--ink);
  stroke: var(--ink);
  stroke-width: 1.5;
}

.node.center .node-label {
  fill: var(--paper);
  font-size: 14px;
  font-style: normal;
  font-variation-settings: "opsz" 24, "wght" 500;
  letter-spacing: 0.02em;
}

.compass.has-selection .node:not(.active) { opacity: 0.42; }

.node:hover .node-bg,
.node:focus-visible .node-bg {
  fill: var(--active-color);
  stroke: var(--active-color);
}
.node.center:hover .node-bg,
.node.center:focus-visible .node-bg {
  fill: var(--active-color);
  stroke: var(--active-color);
}
.node:hover .node-label,
.node:focus-visible .node-label {
  fill: var(--paper);
  font-style: normal;
}

.node.active .node-bg {
  fill: var(--active-color);
  stroke: var(--active-color);
}
.node.active .node-label {
  fill: var(--paper);
  font-style: normal;
  font-variation-settings: "opsz" 24, "wght" 500;
}

.node:focus { outline: none; }
.node:focus-visible .node-bg { stroke-width: 2.5; }

.cardinal-letter {
  font-family: 'Fraunces', Georgia, serif;
  font-variation-settings: "opsz" 14, "wght" 500;
  font-size: 14px;
  fill: var(--ink-soft);
  text-anchor: middle;
  dominant-baseline: middle;
  letter-spacing: 0.05em;
}

/* ---------- Hint ---------- */
.hint {
  text-align: center;
  color: var(--ink-soft);
  font-style: italic;
  font-size: 0.95rem;
  margin: 0.5rem auto 2rem;
  max-width: 40ch;
  opacity: 1;
  transition: opacity 0.35s ease, transform 0.35s ease;
  font-variation-settings: "opsz" 14;
}

.hint.hidden {
  opacity: 0;
  transform: translateY(-4px);
  pointer-events: none;
  height: 0;
  margin: 0;
  overflow: hidden;
}

/* ---------- Panel ---------- */
.panel {
  background: var(--paper);
  border-top: 5px solid var(--active-color);
  padding: 0 clamp(1.25rem, 4vw, 3.5rem);
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1),
              padding 0.6s cubic-bezier(0.4, 0, 0.2, 1),
              border-color 0.4s ease;
  opacity: 0;
  border-radius: 2px;
  box-shadow: 0 2px 12px rgba(43, 31, 23, 0.06);
}

.panel.open {
  max-height: 6000px;
  padding-top: clamp(1.75rem, 4vw, 3rem);
  padding-bottom: clamp(1.75rem, 4vw, 3rem);
  opacity: 1;
  transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1),
              padding 0.6s cubic-bezier(0.4, 0, 0.2, 1),
              opacity 0.4s ease 0.15s,
              border-color 0.4s ease;
}

.panel-head {
  display: flex;
  align-items: baseline;
  gap: clamp(0.75rem, 1.5vw, 1.5rem);
  margin-bottom: 1.5rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--rule);
  position: relative;
}

.panel-mark {
  font-variation-settings: "opsz" 144, "wght" 400;
  font-size: clamp(2rem, 4vw, 2.75rem);
  color: var(--active-color);
  line-height: 1;
  font-style: italic;
  min-width: 2ch;
  text-align: center;
}

.panel-title {
  font-variation-settings: "opsz" 144, "wght" 500, "SOFT" 40;
  font-size: clamp(1.75rem, 4vw, 2.6rem);
  line-height: 1.05;
  letter-spacing: -0.015em;
  color: var(--ink);
  flex: 1;
}

.back-button {
  background: transparent;
  border: 1px solid var(--rule);
  color: var(--ink-soft);
  font-family: 'Fraunces', Georgia, serif;
  font-variation-settings: "opsz" 14, "wght" 500, "SOFT" 40;
  font-size: 0.88rem;
  padding: 0.5rem 0.95rem 0.55rem;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  white-space: nowrap;
  align-self: center;
  letter-spacing: 0.01em;
}

.back-button:hover {
  color: var(--ink);
  border-color: var(--ink-soft);
  background: rgba(43, 31, 23, 0.03);
}
.back-button:active { transform: translateX(-2px); }
.back-button svg { transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
.back-button:hover svg { transform: translateX(-3px); }
.back-button:focus-visible {
  outline: 2px solid var(--active-color);
  outline-offset: 2px;
}

.panel-body { transition: opacity 0.25s ease; }
.panel-body.fading { opacity: 0; }

.panel-lead {
  font-style: italic;
  font-variation-settings: "opsz" 24, "SOFT" 60, "wght" 400;
  font-size: clamp(1.05rem, 1.6vw, 1.2rem);
  color: var(--active-color);
  line-height: 1.5;
  margin-bottom: 1.75rem;
  max-width: 68ch;
}

.panel-body ul {
  list-style: none;
  padding: 0;
}

.panel-body li {
  font-variation-settings: "opsz" 14, "wght" 400, "SOFT" 60;
  font-size: 1.02rem;
  line-height: 1.62;
  color: var(--ink);
  padding-left: 1.4rem;
  position: relative;
  margin-bottom: 0.85rem;
  max-width: 68ch;
  break-inside: avoid;
}

.panel-body li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.85em;
  width: 0.7rem;
  height: 1.5px;
  background: var(--active-color);
  opacity: 0.75;
}

.panel-body li em {
  font-style: italic;
  font-variation-settings: "opsz" 14, "wght" 500;
}

.panel-body li strong {
  font-variation-settings: "opsz" 14, "wght" 600, "SOFT" 40;
  color: var(--ink);
}

/* Two-column layout for wide screens */
@media (min-width: 900px) {
  .panel-body.columns ul {
    column-count: 2;
    column-gap: 3rem;
  }
}

/* ---------- Footer ---------- */
footer {
  text-align: center;
  padding: 3rem 1rem 0;
  color: var(--ink-soft);
  font-size: 0.85rem;
  font-style: italic;
  font-variation-settings: "opsz" 14, "SOFT" 80;
  opacity: 0.7;
}

@media (max-width: 640px) {
  .node .node-label { font-size: 13px; letter-spacing: 0.02em; }
  .node.center .node-label { font-size: 11px; }
  .panel-head {
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: baseline;
  }
  .panel-title { flex: 1 1 100%; order: 3; }
  .panel-mark { order: 1; }
  .back-button { order: 2; margin-left: auto; }
  .panel-body.columns ul { column-count: 1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     LANGUAGE TOGGLE — se posiciona fijo arriba a la derecha
     ═══════════════════════════════════════════════════════════════ -->
<div class="lang-toggle" role="group" aria-label="Idioma / Language">
  <button type="button" data-lang="es" class="active">ES</button>
  <button type="button" data-lang="en">EN</button>
</div>

<div class="wrapper">

  <!-- ═══════════════════════════════════════════════════════════════

  <div class="logos">

      <line class="cardinal-tick" x1="250" y1="480" x2="250" y2="462"/>

      <text class="cardinal-letter" id="card-N" x="250" y="8">N</text>

      <g class="node" data-node="alma" tabindex="0" role="button">

    </svg>
  </div>

  <p class="hint" id="hint"></p>

  <section class="panel" id="panel" aria-live="polite">

    <div class="panel-body columns" id="panel-body"></div>
  </section>

  <footer id="footer"></footer>

</div>

// ============ ESTADO ============
let currentLang = 'es';
let activeNode = null;

// ============ ELEMENTOS ============
const compass    = document.getElementById('compass');
const panel      = document.getElementById('panel');
const panelMark  = document.getElementById('panel-mark');
const panelTitle = document.getElementById('panel-title');
const panelBody  = document.getElementById('panel-body');
const hint       = document.getElementById('hint');
const backBtn    = document.getElementById('back-button');
const backLabel  = document.getElementById('back-label');

// ============ INTERACCIÓN ============
function activateNode(key) {
  const data = translations[currentLang].panels[key];
  if (!data) return;

  // Marca visual en la rosa
  document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
  document.querySelector('.node[data-node="' + key + '"]').classList.add('active');
  compass.classList.add('has-selection');

  // Color activo global
  document.documentElement.style.setProperty('--active-color', data.color);

  // Render del panel
  const renderBody = () => {
    let html = '<p class="panel-lead">' + data.lead + '</p>';
    html += '<ul>';
    data.items.forEach(item => { html += '<li>' + item + '</li>'; });
    html += '</ul>';
    panelBody.innerHTML = html;
    panelMark.textContent = data.mark;
    panelTitle.textContent = data.title;
  };

  if (panel.classList.contains('open') && activeNode !== key) {
    // Cambio suave entre paneles
    panelBody.classList.add('fading');
    setTimeout(() => {
      renderBody();
      panelBody.classList.remove('fading');
    }, 220);
  } else {
    renderBody();
    panel.classList.add('open');
    hint.classList.add('hidden');
    // Scroll suave al panel
    setTimeout(() => {
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }

  activeNode = key;
}

function closePanel() {
  panel.classList.remove('open');
  document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
  compass.classList.remove('has-selection');
  document.documentElement.style.setProperty('--active-color', 'var(--rule)');
  hint.classList.remove('hidden');
  activeNode = null;
  // Scroll de vuelta a la rosa
  compass.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ============ APLICAR IDIOMA ============
function applyLanguage(lang) {
  const t = translations[lang];
  if (!t) return;
  currentLang = lang;

  document.documentElement.lang = t.htmlLang;
  document.title = t.docTitle;

  document.getElementById('eyebrow').textContent = t.eyebrow;
  document.getElementById('title').innerHTML = t.titleHTML;
  document.getElementById('subtitle').innerHTML = t.subtitleHTML;
  hint.textContent = t.hint;
  backLabel.textContent = t.backLabel;
  backBtn.setAttribute('aria-label', t.backAria);
  compass.setAttribute('aria-label', t.compassAria);
  document.querySelector('.lang-toggle').setAttribute('aria-label', t.langLabel);
  document.getElementById('footer').textContent = t.footer;

  document.getElementById('card-N').textContent = t.cardinals.N;
  document.getElementById('card-S').textContent = t.cardinals.S;
  document.getElementById('card-E').textContent = t.cardinals.E;
  document.getElementById('card-W').textContent = t.cardinals.W;

  document.getElementById('lbl-alma').textContent      = t.nodeLabels.alma;
  document.getElementById('lbl-cuerpo').textContent    = t.nodeLabels.cuerpo;
  document.getElementById('lbl-individuo').textContent = t.nodeLabels.individuo;
  document.getElementById('lbl-sociedad').textContent  = t.nodeLabels.sociedad;
  document.getElementById('lbl-persona-1').textContent = t.nodeLabels.personaLine1;
  document.getElementById('lbl-persona-2').textContent = t.nodeLabels.personaLine2;

  // Aria-labels de los nodos
  Object.keys(t.nodeLabels).forEach(k => {
    if (k === 'personaLine1' || k === 'personaLine2') return;
    const node = document.querySelector('.node[data-node="' + k + '"]');
    if (node) node.setAttribute('aria-label', t.nodeLabels[k]);
  });
  const personaNode = document.querySelector('.node[data-node="persona"]');
  if (personaNode) personaNode.setAttribute('aria-label', t.nodeLabels.personaLine1 + ' ' + t.nodeLabels.personaLine2);

  // Botones de idioma
  document.querySelectorAll('.lang-toggle button').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-lang') === lang);
  });

  // Re-render del panel si hay uno abierto
  if (activeNode) {
    const d = t.panels[activeNode];
    panelMark.textContent = d.mark;
    panelTitle.textContent = d.title;
    let html = '<p class="panel-lead">' + d.lead + '</p><ul>';
    d.items.forEach(item => { html += '<li>' + item + '</li>'; });
    html += '</ul>';
    panelBody.innerHTML = html;
  }
}

// ============ EVENTS ============
document.querySelectorAll('.node').forEach(node => {
  const key = node.getAttribute('data-node');
  node.addEventListener('click', () => activateNode(key));
  node.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      activateNode(key);
    }
  });
});

backBtn.addEventListener('click', closePanel);

document.querySelectorAll('.lang-toggle button').forEach(btn => {
  btn.addEventListener('click', () => applyLanguage(btn.getAttribute('data-lang')));
});

// ============ INIT ============
applyLanguage('es');
</script>
